<!DOCTYPE html>
<!-- Nebrepora animated logo — "The Breakout".
     GPU ray tracer (WebGL2) + WebCodecs H.264 encoder + a small MP4 muxer.
     Driven by render.mjs; query params: mode=video|still, w, h, fps, dur, spp, t, alpha, name -->
<html><head><meta charset="utf-8"><title>Nebrepora logo renderer</title></head>
<body>
<script id="scene-fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp int;
uniform vec2 uRes;
uniform float uTime;
uniform int uSpp;
uniform int uAlpha;
uniform int uFrame;     // 0 = full lockup, 1 = mark only (square)
uniform float uZoom;    // >1 pulls the camera back (icon safe zones)
uniform sampler2D uMono;
uniform sampler2D uWord;
out vec4 fragColor;

const float PI = 3.14159265;
const float CM = 0.5;                 // monogram voxel pitch
const vec2  MO = vec2(-1.25, 0.0);    // monogram grid origin (bottom-left)
const ivec2 MD = ivec2(5, 5);
const float CW = 0.10;                // wordmark voxel pitch
const ivec2 WD = ivec2(52, 5);
const vec2  WO = vec2(-2.60, -1.00);
const float FLOOR = -1.32;
const float ZFAR = -12.0;             // voxels fly in from here
const vec3 GOLD = vec3(1.0, 0.766, 0.336);
const vec3 CHAMPAGNE = vec3(0.98, 0.80, 0.50);
const vec3 PEACH = vec3(1.0, 0.60, 0.50);
const vec3 CORAL = vec3(1.0, 0.42, 0.30);   // emissive core (reads peach after tone mapping)
const vec3 BLUE = vec3(0.165, 0.247, 0.898);
const vec3 BREAK_POS = vec3(1.0, 3.25, 0.0);
const float T_BREAK = 3.15;

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float sat(float x){ return clamp(x, 0., 1.); }
float easeOutCubic(float x){ x = sat(x); return 1. - pow(1. - x, 3.); }
float easeOutExpo(float x){ x = sat(x); return x >= 1. ? 1. : 1. - pow(2., -10. * x); }
float easeInOut(float x){ x = sat(x); return x * x * (3. - 2. * x); }
float easeOutBack(float x){ x = sat(x); float c1 = 1.25, c3 = c1 + 1.; return 1. + c3 * pow(x - 1., 3.) + c1 * pow(x - 1., 2.); }

// ---------- choreography ----------
float monoProgress(ivec2 c){ return (uTime - 0.8 - float(c.x + (4 - c.y)) * 0.10 - hash12(vec2(c)) * 0.10) / 1.5; }
float wordProgress(ivec2 c){ return (uTime - 2.3 - float(c.x) / 52.0 * 1.1 - hash12(vec2(c) + 7.0) * 0.12) / 1.2; }
float breakScale(){ return uTime < T_BREAK ? 0. : easeOutBack((uTime - T_BREAK) / 0.55); }
vec3 pelletPos(float t){
  float s = easeInOut((t - 0.2) / (T_BREAK - 0.2));
  vec3 P0 = vec3(-7.5, -0.6, 3.2), P1 = vec3(-2.5, 0.1, 3.0), P2 = vec3(3.2, 4.4, 1.6), P3 = BREAK_POS;
  float u = 1. - s;
  return u*u*u*P0 + 3.*u*u*s*P1 + 3.*u*s*s*P2 + s*s*s*P3;
}
bool pelletOn(){ return uTime > 0.2 && uTime < T_BREAK; }
vec3 lightPos(){ return pelletOn() ? pelletPos(uTime) : BREAK_POS; }
float flash(){ return uTime < T_BREAK ? 0. : exp(-(uTime - T_BREAK) * 3.5); }
float lightI(){ return uTime < 0.2 ? 0. : (pelletOn() ? 2.2 : 0.55 * breakScale() + 4.0 * flash()); }
vec3 emissive(){ return CORAL * (0.85 + 5.0 * flash()); }

// ---------- studio environment ----------
float softbox(vec3 d, vec3 n, vec2 ext, float w){
  float dn = dot(d, n); if (dn <= 0.) return 0.;
  vec3 u = normalize(cross(abs(n.y) > 0.99 ? vec3(1,0,0) : vec3(0,1,0), n)); vec3 v = cross(n, u);
  vec2 p = vec2(dot(d, u), dot(d, v)) / dn;
  return (1. - smoothstep(ext.x, ext.x + w, abs(p.x))) * (1. - smoothstep(ext.y, ext.y + w, abs(p.y)));
}
vec3 envMap(vec3 d, float rough){
  float w = 0.015 + rough * 0.55;
  vec3 c = mix(vec3(0.003, 0.003, 0.008), vec3(0.018, 0.018, 0.03), smoothstep(-0.3, 0.8, d.y));
  if (uAlpha == 1) c += vec3(0.30, 0.28, 0.25) * (0.55 + 0.45 * smoothstep(-0.6, 0.6, d.y));   // transparent export: lighter studio walls so sides stay gold on light backgrounds
  float fz = sat(d.z);
  c += vec3(0.95, 0.88, 0.78) * fz * fz * mix(0.34, 0.86, smoothstep(-0.55, 0.40, d.y));           // front gradient (top bright → bottom deep)
  c += softbox(d, normalize(vec3(0.10, 0.48, 1.0)), vec2(0.55, 0.06), w) * vec3(2.4, 2.2, 1.95);          // key strip for bevel glints
  c += softbox(d, normalize(vec3(-0.7, 0.75, 0.45)), vec2(0.30, 0.16), w) * vec3(3.2, 3.0, 2.7);   // top-left
  c += softbox(d, normalize(vec3(0.0, 1.0, 0.2)), vec2(0.7, 0.07), w) * vec3(2.0);                // top strip
  c += softbox(d, normalize(vec3(1.0, 0.2, -0.35)), vec2(0.10, 0.55), w) * BLUE * 4.5;            // blue rim
  c += softbox(d, normalize(vec3(-1.0, 0.1, -0.3)), vec2(0.10, 0.45), w) * PEACH * 2.2;           // peach fill
  float sw = (uTime - 4.9) / 1.5;                                                                  // light sweep
  if (sw > 0. && sw < 1.) c += softbox(d, normalize(vec3(mix(-1.6, 1.6, easeInOut(sw)), 0.15, 1.0)), vec2(0.035, 1.2), w) * vec3(9.0, 8.4, 7.6) * sin(sw * PI);
  return c;
}

// ---------- geometry ----------
struct Hit { float t; vec3 n; int m; };  // m: 0 miss, 1 monogram, 2 wordmark, 3 breakout, 4 floor, 5 pellet
bool boxHit(vec3 ro, vec3 rd, vec3 c, vec3 b, out float t0, out float t1){
  vec3 inv = 1.0 / rd;
  vec3 ta = (c - b - ro) * inv, tb = (c + b - ro) * inv;
  vec3 mn = min(ta, tb), mx = max(ta, tb);
  t0 = max(max(mn.x, mn.y), mn.z); t1 = min(min(mx.x, mx.y), mx.z);
  return t1 > max(t0, 0.0);
}
float sdRoundBox(vec3 p, vec3 b, float r){ vec3 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, max(q.y, q.z)), 0.) - r; }
vec3 nRoundBox(vec3 p, vec3 b, float r){
  vec3 q = abs(p) - b + r; vec3 s = sign(p); vec3 m = max(q, 0.);
  if (dot(m, m) > 1e-12) return normalize(m * s);
  if (q.x > q.y && q.x > q.z) return vec3(s.x, 0, 0);
  if (q.y > q.z) return vec3(0, s.y, 0);
  return vec3(0, 0, s.z);
}
vec3 pillow(vec3 lp, vec3 h, vec3 n){
  vec3 q = lp / h;
  if (abs(n.z) > 0.9) return normalize(n + vec3(q.x * 0.07, q.y * 0.11, 0.0));
  if (abs(n.y) > 0.9) return normalize(n + vec3(q.x * 0.07, 0.0, q.z * 0.07));
  if (abs(n.x) > 0.9) return normalize(n + vec3(0.0, q.y * 0.07, q.z * 0.07));
  return n;
}
bool roundBox(vec3 ro, vec3 rd, vec3 c, vec3 h, float r, float tLimit, out float t, out vec3 n){
  float t0, t1; if (!boxHit(ro, rd, c, h, t0, t1)) return false;
  t = max(t0, 0.0);
  for (int i = 0; i < 14; i++){
    float d = sdRoundBox(ro + rd * t - c, h, r);
    if (d < 1e-4) break;
    t += d; if (t > t1) return false;
  }
  if (t > tLimit) return false;
  n = nRoundBox(ro + rd * t - c, h, r);
  return true;
}
// 2D DDA over an extruded voxel grid; each occupied cell holds one cube at its own depth.
bool traceGrid(vec3 ro, vec3 rd, bool word, float tLimit, out float tHit, out vec3 nHit){
  float cs = word ? CW : CM; vec2 org = word ? WO : MO; ivec2 dims = word ? WD : MD;
  vec3 bmin = vec3(org, ZFAR - cs), bmax = vec3(org + vec2(dims) * cs, cs);
  float ta, tb; if (!boxHit(ro, rd, (bmin + bmax) * .5, (bmax - bmin) * .5, ta, tb)) return false;
  float t = max(ta, 0.0) + 1e-4; tb = min(tb, tLimit);
  vec3 p = ro + rd * t;
  ivec2 cell = clamp(ivec2(floor((p.xy - org) / cs)), ivec2(0), dims - 1);
  vec2 st = vec2(rd.x >= 0. ? 1. : -1., rd.y >= 0. ? 1. : -1.);
  vec2 rxy = vec2(abs(rd.x) < 1e-7 ? 1e-7 * st.x : rd.x, abs(rd.y) < 1e-7 ? 1e-7 * st.y : rd.y);
  vec2 nextB = (vec2(cell) + max(st, 0.)) * cs + org;
  vec2 tMax = t + (nextB - p.xy) / rxy;
  vec2 tDel = cs / abs(rxy);
  for (int i = 0; i < 96; i++){
    if (t > tb || cell.x < 0 || cell.y < 0 || cell.x >= dims.x || cell.y >= dims.y) break;
    float occ = word ? texelFetch(uWord, cell, 0).r : texelFetch(uMono, cell, 0).r;
    if (occ > 0.5){
      float pr = word ? wordProgress(cell) : monoProgress(cell);
      if (pr > 0.0){
        float sc = mix(0.35, 1.0, easeOutCubic(pr));
        vec3 c = vec3(org + (vec2(cell) + 0.5) * cs, ZFAR * (1. - easeOutExpo(pr)));
        float tt; vec3 nn;
        vec3 hb = word ? vec3(0.5, 0.5, 0.75) * cs * sc : vec3(0.47 * cs * sc);
        if (roundBox(ro, rd, c, hb, word ? 0.0 : 0.15 * cs * sc, tLimit, tt, nn)){
          if (!word) nn = pillow(ro + rd * tt - c, hb, nn);
          tHit = tt; nHit = nn; return true;
        }
      }
    }
    if (tMax.x < tMax.y){ t = tMax.x; tMax.x += tDel.x; cell.x += int(st.x); }
    else { t = tMax.y; tMax.y += tDel.y; cell.y += int(st.y); }
  }
  return false;
}
Hit traceScene(vec3 ro, vec3 rd, bool floorOn){
  Hit h; h.t = 1e9; h.m = 0; h.n = vec3(0);
  float t; vec3 n;
  if (traceGrid(ro, rd, false, h.t, t, n)){ h.t = t; h.n = n; h.m = 1; }
  if (uFrame == 0 && traceGrid(ro, rd, true, h.t, t, n)){ h.t = t; h.n = n; h.m = 2; }
  float bs = breakScale();
  if (bs > 1e-3 && roundBox(ro, rd, BREAK_POS, vec3(CM * 0.47 * bs), CM * 0.15 * bs, h.t, t, n)){ h.t = t; h.n = pillow(ro + rd * t - BREAK_POS, vec3(CM * 0.47 * bs), n); h.m = 3; }
  if (pelletOn()){
    vec3 oc = ro - pelletPos(uTime); float b = dot(oc, rd), c = dot(oc, oc) - 0.07 * 0.07, disc = b * b - c;
    if (disc > 0.){ float ts = -b - sqrt(disc); if (ts > 0. && ts < h.t){ h.t = ts; h.m = 5; } }
  }
  if (floorOn && rd.y < 0.){ float tf = (FLOOR - ro.y) / rd.y; if (tf > 0. && tf < h.t){ h.t = tf; h.n = vec3(0, 1, 0); h.m = 4; } }
  return h;
}

// ---------- shading ----------
vec3 pointLight(vec3 p, vec3 n, vec3 rd, vec3 F0, float rough){
  float I = lightI(); if (I <= 0.) return vec3(0);
  vec3 L = lightPos() - p; float d2 = dot(L, L); L *= inversesqrt(d2);
  vec3 H = normalize(L - rd);
  float ndl = max(dot(n, L), 0.), ndh = max(dot(n, H), 0.);
  float a2 = pow(rough * rough, 2.);
  float D = a2 / (PI * pow(ndh * ndh * (a2 - 1.) + 1., 2.));
  vec3 F = F0 + (1. - F0) * pow(1. - max(dot(H, -rd), 0.), 5.);
  return PEACH * I / (1. + d2) * (F * min(D, 60.) * 0.12 * ndl + F0 * ndl * 0.08);
}
vec3 metalSimple(vec3 p, vec3 n, vec3 rd, vec3 F0, float rough){
  vec3 F = F0 + (1. - F0) * pow(1. - max(dot(n, -rd), 0.), 5.);
  return F * envMap(reflect(rd, n), rough) + pointLight(p, n, rd, F0, rough);
}
vec3 floorSimple(vec3 p, vec3 rd){
  float d2 = dot(lightPos() - p, lightPos() - p);
  return PEACH * lightI() * 0.05 / (0.3 + d2) + envMap(reflect(rd, vec3(0, 1, 0)), 0.4) * 0.15;
}
vec3 shadeSecondary(Hit h, vec3 q, vec3 rd){
  if (h.m == 1) return metalSimple(q, h.n, rd, GOLD, 0.16);
  if (h.m == 2) return metalSimple(q, h.n, rd, CHAMPAGNE, 0.20);
  if (h.m == 3 || h.m == 5) return emissive();
  if (h.m == 4) return floorSimple(q, rd);
  return envMap(rd, 0.0);
}
vec3 brushed(vec3 p, vec3 n){
  if (abs(n.z) < 0.9) return n;
  float y = p.y * 140.0 + sin(p.x * 3.1) * 0.6;
  float i = floor(y), f = fract(y); f = f * f * (3.0 - 2.0 * f);
  float s = mix(hash12(vec2(i, 1.7)), hash12(vec2(i + 1.0, 1.7)), f) - 0.5;
  return normalize(n + vec3(0.0, s * 0.006, 0.0));
}
vec3 metal(vec3 p, vec3 n, vec3 rd, vec3 F0, float rough){
  n = brushed(p, n);
  vec3 F = F0 + (1. - F0) * pow(1. - max(dot(n, -rd), 0.), 5.);
  vec3 r = reflect(rd, n);
  vec3 o = p + n * 2e-3;
  Hit h = traceScene(o, r, uAlpha == 0);
  vec3 refl = h.m == 0 ? envMap(r, rough) : shadeSecondary(h, o + r * h.t, r);
  return F * refl + pointLight(p, n, rd, F0, rough);
}
vec3 background(vec2 uv){
  float r = length((uv - vec2(0.0, 0.30)) * vec2(0.8, 1.0));
  return vec3(0.004, 0.004, 0.009) + BLUE * 0.055 * exp(-r * r * 2.2);
}
vec3 floorShade(vec3 p, vec3 rd, vec2 uv){
  float F = 0.04 + 0.96 * pow(1. - max(-rd.y, 0.), 5.);
  vec3 r = reflect(rd, vec3(0, 1, 0));
  Hit h = traceScene(p + vec3(0, 1e-3, 0), r, false);
  vec3 refl = h.m == 0 ? vec3(0) : shadeSecondary(h, p + r * h.t, r) * exp(-h.t * 1.3);
  vec3 col = refl * mix(0.12, 0.5, F);
  float d2 = dot(lightPos() - p, lightPos() - p);
  col += PEACH * lightI() * 0.035 / (0.3 + d2);
  float fade = exp(-max(-p.z - 1.5, 0.) * 0.35) * exp(-max(abs(p.x) - 4.5, 0.) * 0.3);
  return mix(background(uv), col + vec3(0.002, 0.002, 0.004), fade);
}
vec3 glowAt(vec3 ro, vec3 rd, float tHit, vec3 c, vec3 col, float size){
  float tc = dot(c - ro, rd); if (tc < 0.) return vec3(0);
  float d = length(ro + rd * tc - c);
  float vis = tc > tHit + 0.02 ? 0.2 : 1.0;
  return col * vis * (exp(-d * d / (size * size)) * 0.8 + 0.004 / (d * d + 0.004));
}

vec4 renderSample(vec2 fc){
  vec2 uv = (2.0 * fc - uRes) / uRes.y;
  float k = easeInOut(uTime / 7.0);
  float ang = mix(-0.30, 0.03, k), dist = mix(12.8, 11.7, k);
  vec3 target = uFrame == 1 ? vec3(0.0, 1.72, 0.0) : vec3(0.0, 0.95, 0.0);
  if (uFrame == 1) dist *= 0.64;
  dist *= uZoom;
  vec3 ro = target + vec3(sin(ang) * dist, mix(1.5, 0.55, k), cos(ang) * dist);
  vec3 fw = normalize(target - ro), rt = normalize(cross(fw, vec3(0, 1, 0))), up = cross(rt, fw);
  vec3 rd = normalize(fw / tan(radians(17.0)) + rt * uv.x + up * uv.y);

  Hit h = traceScene(ro, rd, uAlpha == 0);
  vec3 p = ro + rd * h.t, col; float a = 0.;
  if (h.m == 1){ col = metal(p, h.n, rd, GOLD, 0.16); a = 1.; }
  else if (h.m == 2){ col = metal(p, h.n, rd, CHAMPAGNE, 0.20); a = 1.; }
  else if (h.m == 3){ col = emissive() * (0.55 + 0.45 * max(dot(h.n, -rd), 0.)) + metalSimple(p, h.n, rd, GOLD, 0.2) * 0.15; a = 1.; }
  else if (h.m == 5){ col = emissive() * 1.6; a = 1.; }
  else if (h.m == 4){ col = floorShade(p, rd, uv); }
  else { col = uAlpha == 0 ? background(uv) : vec3(0); }
  if (h.m == 1 || h.m == 2) col *= 1. - sat((-p.z - 1.0) / 8.5);    // emerge from darkness

  vec3 g = vec3(0);
  if (pelletOn()) g += glowAt(ro, rd, h.t, pelletPos(uTime), CORAL * 1.4, 0.22);
  if (breakScale() > 0.) g += glowAt(ro, rd, h.t, BREAK_POS, CORAL * (0.22 + 2.5 * flash()), 0.42 + 0.6 * flash());
  col += g;
  a = max(a, sat(dot(g, vec3(0.3, 0.5, 0.2)) * 1.5));
  return vec4(col, a);
}

void main(){
  vec4 acc = vec4(0);
  // rotated-grid supersampling
  vec2 o4[4] = vec2[](vec2(0.125, 0.375), vec2(0.375, -0.125), vec2(-0.125, -0.375), vec2(-0.375, 0.125));
  for (int i = 0; i < 4; i++){ if (i >= uSpp) break; acc += renderSample(gl_FragCoord.xy + (uSpp == 1 ? vec2(0) : o4[i])); }
  fragColor = acc / float(uSpp);
}
</script>

<script id="post-fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform sampler2D uHdr;
uniform vec2 uRes;
uniform float uTime;
uniform float uDur;
uniform int uAlpha;
uniform int uFlip;
out vec4 fragColor;
vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0., 1.); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  if (uFlip == 1) uv.y = 1.0 - uv.y;
  vec4 s = texture(uHdr, uv);
  vec3 bloom = vec3(0);
  for (int l = 2; l <= 7; l++){
    vec2 px = exp2(float(l)) / uRes;
    vec3 m = (textureLod(uHdr, uv + vec2(px.x, px.y) * .5, float(l)).rgb + textureLod(uHdr, uv + vec2(-px.x, px.y) * .5, float(l)).rgb
            + textureLod(uHdr, uv + vec2(px.x, -px.y) * .5, float(l)).rgb + textureLod(uHdr, uv - px * .5, float(l)).rgb) * 0.25;
    bloom += max(m - 0.55, 0.0) * (0.55 - float(l - 2) * 0.06);
  }
  vec3 col = s.rgb + bloom * 0.7;
  if (uAlpha == 0){
    col *= smoothstep(0.0, 0.7, uTime) * (1.0 - smoothstep(uDur - 0.15, uDur, uTime) * 0.0);
    col = aces(col * 1.05);
    col = pow(col, vec3(1.0 / 2.2));
    vec2 q = uv - 0.5; col *= 1.0 - dot(q, q) * 0.55;
    col += (hash(gl_FragCoord.xy + fract(uTime) * 91.7) - 0.5) / 255.0;   // dither against banding
    fragColor = vec4(col, 1.0);
  } else {
    float a = clamp(s.a + dot(bloom, vec3(0.3, 0.5, 0.2)) * 1.2, 0., 1.);
    col = pow(aces(col * 1.05), vec3(1.0 / 2.2));
    fragColor = vec4(a > 0.001 ? min(col / a, 1.0) : vec3(0), a);
  }
}
</script>

<script>
const Q = Object.fromEntries(new URLSearchParams(location.search));
const W = +Q.w || 3840, H = +Q.h || 2160, FPS = +Q.fps || 60, DUR = +Q.dur || 7.5, SPP = +Q.spp || 4;
const log = (msg) => fetch("/log", { method: "POST", body: String(msg) });
const save = (name, data) => fetch(`/save/${encodeURIComponent(name)}`, { method: "POST", body: data });

// ---------- voxel bitmaps (rows top → bottom) ----------
const MONO = ["X...X", "XX..X", "X.X.X", "X..XX", "X...X"];
const GLYPHS = {
  N: ["X..X", "XX.X", "X.XX", "X..X", "X..X"],
  E: ["XXXX", "X...", "XXX.", "X...", "XXXX"],
  B: ["XXX.", "X..X", "XXX.", "X..X", "XXX."],
  R: ["XXX.", "X..X", "XXX.", "X.X.", "X..X"],
  P: ["XXX.", "X..X", "XXX.", "X...", "X..."],
  O: [".XX.", "X..X", "X..X", "X..X", ".XX."],
  A: [".XX.", "X..X", "XXXX", "X..X", "X..X"]
};
function bitmap(rows){ const h = rows.length, w = rows[0].length, d = new Uint8Array(w * h);
  rows.forEach((r, y) => [...r].forEach((ch, x) => { d[(h - 1 - y) * w + x] = ch === "X" ? 255 : 0; })); return { w, h, d }; }
const wordRows = Array.from({ length: 5 }, (_, y) => [..."NEBREPORA"].map((ch) => GLYPHS[ch][y]).join(".."));

// ---------- WebGL ----------
const canvas = document.createElement("canvas"); canvas.width = W; canvas.height = H;
const gl = canvas.getContext("webgl2", { antialias: false, preserveDrawingBuffer: true, premultipliedAlpha: false, alpha: true });
if (!gl.getExtension("EXT_color_buffer_float")) throw new Error("EXT_color_buffer_float missing");
const VS = "#version 300 es\nin vec2 p; void main(){ gl_Position = vec4(p, 0, 1); }";
function program(fsId){
  const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const pr = gl.createProgram();

const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function tex8(bm, unit){ const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, bm.w, bm.h, 0, gl.RED, gl.UNSIGNED_BYTE, bm.d);
  for (const p of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, p, gl.NEAREST); return t; }
tex8(bitmap(MONO), 1); tex8(bitmap(wordRows), 2);

const hdr = gl.createTexture(); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, hdr);
const levels = Math.floor(Math.log2(Math.max(W, H))) + 1;
gl.texStorage2D(gl.TEXTURE_2D, levels, gl.RGBA16F, W, H);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
for (const p of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D, p, gl.CLAMP_TO_EDGE);
const fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, hdr, 0);

const scene = program("scene-fs"), post = program("post-fs");
function draw(t, alpha, flip = false){
  gl.viewport(0, 0, W, H);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.useProgram(scene.pr);
  gl.uniform2f(scene.u.uRes, W, H); gl.uniform1f(scene.u.uTime, t); gl.uniform1i(scene.u.uSpp, SPP); gl.uniform1i(scene.u.uAlpha, alpha ? 1 : 0); gl.uniform1i(scene.u.uFrame, Q.frame === "mark" ? 1 : 0); gl.uniform1f(scene.u.uZoom, +Q.zoom || 1);
  gl.uniform1i(scene.u.uMono, 1); gl.uniform1i(scene.u.uWord, 2);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, hdr); gl.generateMipmap(gl.TEXTURE_2D);

  gl.drawArrays(gl.TRIANGLES, 0, 3);

// ---------- minimal MP4 (ISO BMFF) muxer for one H.264 track ----------
const enc = new TextEncoder();
const cat = (parts) => { const n = parts.reduce((s, p) => s + p.length, 0), o = new Uint8Array(n); let i = 0; for (const p of parts) { o.set(p, i); i += p.length; } return o; };
const u8 = (...a) => new Uint8Array(a);
const u16 = (n) => u8((n >> 8) & 255, n & 255);
const u32 = (n) => u8((n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255);
const box = (type, ...parts) => { const body = cat(parts); return cat([u32(body.length + 8), enc.encode(type), body]); };
const fbox = (type, v, flags, ...parts) => box(type, u8(v, (flags >> 16) & 255, (flags >> 8) & 255, flags & 255), ...parts);
const MATRIX = cat([u32(0x10000), u32(0), u32(0), u32(0), u32(0x10000), u32(0), u32(0), u32(0), u32(0x40000000)]);
function muxMp4(samples, avcC, w, h, fps){
  const ts = fps * 1000, delta = 1000, n = samples.length, dur = n * delta, durMs = Math.round(n * 1000 / fps);
  const stbl = box("stbl",
    fbox("stsd", 0, 0, u32(1), box("avc1", new Uint8Array(6), u16(1), new Uint8Array(16), u16(w), u16(h), u32(0x480000), u32(0x480000), u32(0), u16(1), new Uint8Array(32), u16(0x18), u16(0xffff), box("avcC", avcC))),
    fbox("stts", 0, 0, u32(1), u32(n), u32(delta)),
    fbox("stss", 0, 0, u32(samples.filter((s) => s.key).length), ...samples.flatMap((s, i) => s.key ? [u32(i + 1)] : [])),
    fbox("stsc", 0, 0, u32(1), u32(1), u32(n), u32(1)),
    fbox("stsz", 0, 0, u32(0), u32(n), ...samples.map((s) => u32(s.data.length))),
    fbox("stco", 0, 0, u32(1), u32(0)));
  const moovFor = (offset) => box("moov",
    fbox("mvhd", 0, 0, u32(0), u32(0), u32(1000), u32(durMs), u32(0x10000), u16(0x100), new Uint8Array(10), MATRIX, new Uint8Array(24), u32(2)),
    box("trak",
      fbox("tkhd", 0, 3, u32(0), u32(0), u32(1), u32(0), u32(durMs), new Uint8Array(8), u16(0), u16(0), u16(0), u16(0), MATRIX, u32(w << 16), u32(h << 16)),
      box("mdia",
        fbox("mdhd", 0, 0, u32(0), u32(0), u32(ts), u32(dur), u16(0x55c4), u16(0)),
        fbox("hdlr", 0, 0, u32(0), enc.encode("vide"), new Uint8Array(12), enc.encode("Nebrepora\0")),
        box("minf", fbox("vmhd", 0, 1, new Uint8Array(8)), box("dinf", fbox("dref", 0, 0, u32(1), fbox("url ", 0, 1))),
          offset === null ? stbl : patchStco(stbl, offset)))));
  const ftyp = box("ftyp", enc.encode("isom"), u32(512), enc.encode("isomiso2avc1mp41"));
  const moovLen = moovFor(null).length;
  const offset = ftyp.length + moovLen + 8;
  const mdatLen = samples.reduce((s, x) => s + x.data.length, 0) + 8;
  return new Blob([ftyp, moovFor(offset), u32(mdatLen), enc.encode("mdat"), ...samples.map((s) => s.data)], { type: "video/mp4" });
}
function patchStco(stbl, offset){ const c = stbl.slice(); for (let i = c.length - 16; i >= 0; i--) {
  if (c[i] === 0x73 && c[i + 1] === 0x74 && c[i + 2] === 0x63 && c[i + 3] === 0x6f) { c.set(u32(offset), i + 12); return c; } } throw new Error("stco not found"); }

async function renderVideo(){
  const frames = Math.round(DUR * FPS), samples = []; let avcC = null, lastTs = -1, reordered = false;
  const encoder = new VideoEncoder({
    output: (chunk, meta) => {
      if (meta?.decoderConfig?.description && !avcC) avcC = new Uint8Array(meta.decoderConfig.description);
      const data = new Uint8Array(chunk.byteLength); chunk.copyTo(data);
      if (chunk.timestamp < lastTs) reordered = true; lastTs = chunk.timestamp;
      samples.push({ data, key: chunk.type === "key" });
    },
    error: (e) => log("encoder error: " + e.message)
  });
  const base = { codec: Q.codec || "avc1.640034", width: W, height: H, bitrate: +Q.bitrate || 45e6, framerate: FPS, latencyMode: "quality", avc: { format: "avc" } };
  let cfg = { ...base, hardwareAcceleration: "prefer-hardware" };
  if (!(await VideoEncoder.isConfigSupported(cfg)).supported) cfg = { ...base, hardwareAcceleration: "no-preference" };
  encoder.configure(cfg); log(`encoder: ${cfg.codec} ${cfg.hardwareAcceleration} ${W}x${H}@${FPS} ${frames} frames`);
  const t0 = performance.now();
  const px = new Uint8Array(W * H * 4);
  for (let i = 0; i < frames; i++) {
    draw(i / FPS, false, true);
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);   // blocks until this frame is fully rendered
    const vf = new VideoFrame(px, { format: "RGBX", codedWidth: W, codedHeight: H, timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    encoder.encode(vf, { keyFrame: i % (FPS * 2) === 0 }); vf.close();
    while (encoder.encodeQueueSize > 6) await new Promise((r) => setTimeout(r, 5));
    if (i % 60 === 0) log(`frame ${i}/${frames} (${((performance.now() - t0) / (i + 1)).toFixed(0)} ms/frame)`);
  }
  await encoder.flush(); encoder.close();
  if (reordered) log("WARNING: encoder reordered frames (B-frames); ctts not written");
  const mp4 = muxMp4(samples, avcC, W, H, FPS);
  log(`encoded ${samples.length} samples, ${(mp4.size / 1e6).toFixed(1)} MB in ${((performance.now() - t0) / 1000).toFixed(1)} s`);
  await save(Q.name || "nebrepora-logo-4k.mp4", mp4);
}
async function renderStill(){
  draw(+Q.t || 7.2, Q.alpha === "1");
  const blob = await new Promise((r) => canvas.toBlob(r, "image/png"));
  await save(Q.name || "still.png", blob);
}
(async () => {
  try {
    const ri = gl.getExtension("WEBGL_debug_renderer_info");
    await log("GPU: " + (ri ? gl.getParameter(ri.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)));
    if (Q.mode === "video") await renderVideo(); else await renderStill();
  } catch (e) { await log("ERROR: " + (e.stack || e.message)); }
  await fetch("/done", { method: "POST" });
})();
