name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax + prerender drift
        run: npm run check
      - name: No inline scripts, styles, or handlers (CSP)
        run: |
          ! grep -nE '<script(>| (type="text/javascript"|src="(http|//)))|<style|style="| on[a-z]+="' public/index.html public/404.html
